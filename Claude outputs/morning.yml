name: Morning report

on:
  schedule:
    # 05:30 UTC on weekdays = 06:30 UK in summer, 05:30 UK in winter.
    - cron: "30 5 * * 1-5"
  workflow_dispatch:      # lets you run it on demand from the GitHub app

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build today's report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/morning.py

      # Voice is a bolt-on. It installs its own dependency, runs in its own
      # step, and is allowed to fail without taking the report down with it.
      - name: Cache the Piper voice model
        uses: actions/cache@v4
        with:
          path: .voice
          key: piper-voice-${{ env.PIPER_VOICE || 'en_GB-alan-medium' }}

      - name: Speak the brief
        continue-on-error: true
        env:
          PIPER_VOICE: en_GB-alan-medium
          AUDIO_KEEP_DAYS: "30"
        run: |
          pip install --quiet piper-tts
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          python scripts/audio.py

      - name: Commit output
        run: |
          git config user.name  "gold-risk-bot"
          git config user.email "actions@github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "morning report $(date -u +%Y-%m-%d)"
          git push

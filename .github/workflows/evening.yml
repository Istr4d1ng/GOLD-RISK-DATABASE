name: Evening reaction log

on:
  schedule:
    # 21:30 UTC weekdays - after the US session has closed.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record gold's reaction to today's events
        run: python scripts/evening.py

      - name: Commit output
        run: |
          git config user.name  "gold-risk-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet || git commit -m "reaction log $(date -u +%Y-%m-%d)"
          git push

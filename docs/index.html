<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold / USD Daily Risk Database</title>
<style>
  :root{--bg:#0d0f12;--fg:#e8eaed;--muted:#9aa3af;--line:#232830;--card:#15181d}
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
    --bg:#f6f7f9;--fg:#14171c;--muted:#5d6673;--line:#e3e6ea;--card:#fff}}
  body{margin:0;background:var(--bg);color:var(--fg);display:grid;
    place-items:center;min-height:100vh;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:32px;max-width:440px;margin:20px}
  h1{font-size:19px;margin:0 0 12px}p{color:var(--muted);margin:0 0 10px}
  code{background:var(--line);padding:2px 6px;border-radius:5px;font-size:13px}
</style></head><body>
<div class="card">
  <h1>Gold / USD Daily Risk Database</h1>
  <p>No report has been built yet. The first one appears here after the morning
  job runs.</p>
  <p>To build it now: <strong>Actions → Morning report → Run workflow</strong>,
  or run <code>python scripts/morning.py</code> locally.</p>
</div></body></html>
